name: nse-scanner

on:
  schedule:
    - cron: "*/5 3-9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas requests
      - name: Run scanner
        run: python scanner.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "scanner"
          git config user.email "scanner@users.noreply.github.com"
          git add alerted.json
          git diff --staged --quiet || (git commit -m "update alerts" && git push)
